[project]
name = "dog-training-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "qdrant-client>=1.15,<2.0",
    "sentence-transformers>=5.1,<6.0",
    "uvicorn>=0.35,<1.0",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.10,<3.0",
    "pytest>=8.4,<10.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["scripts"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
