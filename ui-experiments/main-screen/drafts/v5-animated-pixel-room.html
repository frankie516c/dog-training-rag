<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>댕스 · Animated Pixel Room</title>
  <style>
    :root {
      color-scheme: light;
      --room-ratio: 1122 / 1402;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #cbae83;
    }

    body {
      display: grid;
      place-items: center;
      overflow: auto;
    }

    .room-stage {
      position: relative;
      width: min(100vw, calc(100vh * 1122 / 1402));
      aspect-ratio: var(--room-ratio);
      overflow: hidden;
      isolation: isolate;
      background: #d0ae7f;
    }

    .room-background {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      user-select: none;
      pointer-events: none;
    }

    .dog-shadow {
      position: absolute;
      z-index: 1;
      left: 33.1%;
      top: 70.8%;
      width: 19.2%;
      height: 2.8%;
      border-radius: 50%;
      background: rgba(126, 87, 45, .3);
      image-rendering: pixelated;
      animation: shadow-idle 2.4s steps(4, end) infinite;
      pointer-events: none;
    }

    .dog {
      position: absolute;
      z-index: 2;
      left: 20%;
      top: 47%;
      width: 43%;
      aspect-ratio: 1;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      transform-origin: 50% 74%;
      animation: dog-idle 2.4s steps(8, end) infinite;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .dog img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      user-select: none;
      pointer-events: none;
    }

    .dog:focus-visible {
      outline: 4px solid rgba(91, 116, 68, .85);
      outline-offset: -18%;
    }

    .dog.is-excited {
      animation: dog-excited .82s steps(8, end) 1;
    }

    .room-stage:has(.dog.is-excited) .dog-shadow {
      animation: shadow-excited .82s steps(8, end) 1;
    }

    .pixel-heart {
      position: absolute;
      z-index: 3;
      left: 50.5%;
      top: 51.5%;
      width: 2.2%;
      aspect-ratio: 1;
      opacity: 0;
      pointer-events: none;
    }

    .pixel-heart::before {
      content: "";
      position: absolute;
      width: 25%;
      height: 25%;
      background: #df826f;
      box-shadow:
        100% 0 #df826f,
        200% 0 #df826f,
        400% 0 #df826f,
        500% 0 #df826f,
        0 100% #df826f,
        100% 100% #f0a08a,
        200% 100% #df826f,
        300% 100% #df826f,
        400% 100% #df826f,
        500% 100% #df826f,
        600% 100% #c9685a,
        100% 200% #df826f,
        200% 200% #df826f,
        300% 200% #df826f,
        400% 200% #df826f,
        500% 200% #c9685a,
        200% 300% #df826f,
        300% 300% #df826f,
        400% 300% #c9685a,
        300% 400% #c9685a;
    }

    .dog.is-excited + .pixel-heart {
      animation: heart-pop .82s steps(6, end) 1;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes dog-idle {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1, 1); }
      25% { transform: translate3d(-.3%, -.7%, 0) scale(1.006, .994); }
      50% { transform: translate3d(0, -1.5%, 0) scale(.995, 1.008); }
      75% { transform: translate3d(.35%, -.6%, 0) scale(1.004, .996); }
    }

    @keyframes shadow-idle {
      0%, 100% { transform: scaleX(1); opacity: .92; }
      50% { transform: scaleX(.94); opacity: .72; }
    }

    @keyframes dog-excited {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      12% { transform: translate3d(-1%, 1.6%, 0) scale(1.04, .94); }
      28% { transform: translate3d(-1.4%, -8%, 0) rotate(-1.5deg) scale(.98, 1.03); }
      44% { transform: translate3d(1%, -11%, 0) rotate(1.3deg) scale(.98, 1.04); }
      62% { transform: translate3d(.6%, -3%, 0) rotate(.4deg) scale(1.02, .97); }
      76% { transform: translate3d(-.4%, 1%, 0) scale(1.035, .95); }
      88% { transform: translate3d(0, -.8%, 0) scale(.995, 1.01); }
    }

    @keyframes shadow-excited {
      0%, 100% { transform: scaleX(1); opacity: .92; }
      28%, 44% { transform: scaleX(.68); opacity: .38; }
      76% { transform: scaleX(1.08); opacity: .84; }
    }

    @keyframes heart-pop {
      0% { opacity: 0; transform: translate(0, 20%) scale(.5); }
      16%, 62% { opacity: 1; }
      48% { transform: translate(22%, -110%) scale(1); }
      100% { opacity: 0; transform: translate(42%, -210%) scale(.8); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dog,
      .dog-shadow,
      .dog.is-excited,
      .room-stage:has(.dog.is-excited) .dog-shadow,
      .dog.is-excited + .pixel-heart {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="room-stage" aria-label="움직이는 강아지가 있는 픽셀 아트 방">
    <img
      class="room-background"
      src="../assets/pixel-room-v5-background.png"
      alt="아치형 창문, 올리브색 문, 식물, 수납장, 강아지 집, 러그와 공이 있는 포근한 픽셀 아트 방"
    >
    <span class="dog-shadow" aria-hidden="true"></span>
    <button class="dog" id="animatedDog" type="button" aria-label="강아지와 놀기">
      <img src="../assets/pixel-dog-v5-sprite-final.png" alt="신나게 서 있는 크림색 토이푸들">
    </button>
    <span class="pixel-heart" aria-hidden="true"></span>
    <p class="visually-hidden">강아지는 천천히 숨을 쉬며 움직입니다. 강아지를 누르면 신나게 뛰어요.</p>
  </main>

  <script>
    const dog = document.querySelector("#animatedDog");
    let animationTimer;

    function exciteDog() {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      clearTimeout(animationTimer);
      dog.classList.remove("is-excited");
      void dog.offsetWidth;
      dog.classList.add("is-excited");
      animationTimer = setTimeout(() => dog.classList.remove("is-excited"), 840);
    }

    dog.addEventListener("click", exciteDog);
    setTimeout(exciteDog, 1800);
    setInterval(exciteDog, 7200);
  </script>
</body>
</html>
